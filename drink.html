<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drink Details — Moānā Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ocean-shine.css">
<style>
  .drink-detail-section {
    padding: 140px 0 80px;
    min-height: 80vh;
  }
  .drink-card-large {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
    background: var(--paper);
    padding: 30px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    align-items: center;
  }
  @media (min-width: 768px) {
    .drink-card-large {
      grid-template-columns: 1fr 1fr;
    }
  }
  .drink-image img {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: var(--radius-sm);
  }
  .drink-info h1 {
    font-size: 36px;
    color: var(--navy);
    margin-bottom: 12px;
  }
  .drink-info .price {
    font-size: 24px;
    margin-bottom: 20px;
    display: block;
    color: var(--gold);
    font-weight: 600;
  }
  .drink-info .desc {
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<header class="site-header is-scrolled" id="siteHeader">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <img src="logo.jpg" alt="Moānā Café" class="brand__mark">
    </a>
    <nav class="nav" id="mainNav">
      <a href="index.html#about">Story</a>
      <a href="menu.html">Menu</a>
      <a href="index.html#gallery">Gallery</a>
      <a href="index.html#vibes">Vibes</a>
      <a href="social.html">Social</a>
      <a href="location.html">Location</a>
    </nav>
  </div>
</header>

<main class="drink-detail-section">
  <div class="wrap">
    <a href="menu.html" class="btn btn--outline-dark" style="margin-bottom: 24px;">← Back to Menu</a>
    
    <div class="drink-card-large">
      <div class="drink-image">
        <img id="drinkImg" src="iced-coffee-closeup.jpg" alt="Drink Image">
      </div>
      <div class="drink-info">
        <h1 id="drinkName">Drink Name</h1>
        <span class="price" id="drinkPrice">0 EGP</span>
        <p class="desc" id="drinkDesc">Description loading...</p>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap footer-bottom" style="text-align: center; padding: 20px 0;">
    <span>© 2026 Moānā Café. All rights reserved.</span>
  </div>
</footer>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name');
    const price = params.get('price');
    const desc = params.get('desc');
    const img = params.get('img');

    if (name) document.getElementById('drinkName').innerText = name;
    if (price) document.getElementById('drinkPrice').innerText = price + (price.includes('EGP') ? '' : ' EGP');
    if (desc) document.getElementById('drinkDesc').innerText = desc;
    if (img) document.getElementById('drinkImg').src = img;
  });

  
  const burger = document.querySelector('.menu-burger');
  const nav = document.querySelector('.nav');

  burger.addEventListener('click', () => {
    nav.classList.toggle('active');
  });

</script>
</body>
</html>
